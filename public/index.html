<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M5 1h6l4 4v6l-4 4H5l-4-4V5z' fill='%23000' stroke='%23faad14' stroke-width='1.5'/%3E%3Cpath d='M6 5.5 8 8l-2 2.5M8.5 10.5H11' fill='none' stroke='%23faad14' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script>window.HUB_TOKEN = '__HUB_TOKEN__';</script>
</head>
<body>
  <!-- Bộ icon dùng chung: <svg class="ico"><use href="#i-..."/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-hub" viewBox="0 0 24 24"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/><path d="m8 9 3 3-3 3M13 15h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
      <symbol id="i-repo" viewBox="0 0 24 24"><path d="M4 4h6l2 3h8v13H4z"/><path d="M4 10h16"/></symbol>
      <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-6 4-11 8.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
      <symbol id="i-resume" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M3 4h18v16H3z"/><path d="m7 9 3 3-3 3M12 15h5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M12 10v6"/></symbol>
      <symbol id="i-git" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-session" viewBox="0 0 24 24"><path d="m5 8 4 4-4 4M11 16h8"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M9 7H5v10h4M15 7h4v10h-4M8 12h8"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M9.5 2h5l.7 3 2.6 1.5 3-.9 2.5 4.3-2.3 2.1v3l2.3 2.1-2.5 4.3-3-.9-2.6 1.5-.7 3h-5l-.7-3-2.6-1.5-3 .9L.7 16.1 3 14v-3L.7 8.9 3.2 4.6l3 .9L8.8 4z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></symbol>
      <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h5l2-6 4 12 2-6h7"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <button class="brand" id="home" title="Tổng quan">
      <svg class="ico ico-lg"><use href="#i-hub"/></svg>
      <span id="brand-name">CLAUDE<b>//</b>HUB</span>
    </button>
    <div class="counts" id="counts"></div>
    <div class="spacer"></div>
    <span class="conn" id="conn">đang kết nối…</span>
    <button id="enable-notify" class="btn ghost" hidden><svg class="ico"><use href="#i-bell"/></svg>Bật thông báo</button>
    <button id="add-project" class="btn primary"><svg class="ico"><use href="#i-plus"/></svg>Thêm dự án</button>
    <button id="open-settings" class="btn ghost" title="Cài đặt"><svg class="ico"><use href="#i-gear"/></svg>Cài đặt</button>
  </header>
  <div class="layout">
    <nav class="sidebar" id="tree"></nav>
    <main class="main">
      <section id="overview" class="overview"></section>
      <section id="worktree-view" class="panel" hidden></section>
      <section id="session-view" class="session-view" hidden>
        <div class="session-head">
          <div class="crumbs" id="session-crumbs"></div>
          <div class="actions">
            <button class="btn ghost" data-act="shell" title="Mở terminal tại thư mục của phiên"><svg class="ico"><use href="#i-terminal"/></svg>Terminal</button>
            <button class="btn ghost" data-act="rename" title="Đặt tên phiên"><svg class="ico"><use href="#i-edit"/></svg>Đặt tên</button>
            <button class="btn ghost" data-act="mcp"><svg class="ico"><use href="#i-plug"/></svg><span class="mcp-label">MCP</span></button>
            <button class="btn ghost" data-act="files"><svg class="ico"><use href="#i-file"/></svg><span class="files-label">File đã sửa</span></button>
            <button class="btn ghost" data-act="lazygit"><svg class="ico"><use href="#i-git"/></svg>lazygit</button>
            <button class="btn ghost" data-act="explorer"><svg class="ico"><use href="#i-folder"/></svg>Thư mục</button>
            <button class="btn ghost" data-act="kill"><svg class="ico"><use href="#i-stop"/></svg>Dừng</button>
            <button class="btn ghost danger" data-act="remove"><svg class="ico"><use href="#i-close"/></svg>Đóng phiên</button>
          </div>
        </div>
        <div class="session-body">
          <div class="terminals" id="terminals"></div>
          <aside class="files" id="files" hidden></aside>
          <aside class="files mcp-panel" id="mcp-panel" hidden></aside>
        </div>
      </section>
    </main>
  </div>
  <div class="diff-modal" id="diff-modal" hidden>
    <div class="diff-box">
      <div class="diff-head"><span id="diff-title"></span><button class="btn ghost" id="diff-close"><svg class="ico"><use href="#i-close"/></svg>Đóng</button></div>
      <pre id="diff-body"></pre>
    </div>
  </div>
  <div class="term-pop" id="term-pop" hidden>
    <div class="term-pop-head" id="term-pop-head">
      <svg class="ico"><use href="#i-terminal"/></svg>
      <div class="term-tabs" id="term-tabs"></div>
      <select id="term-kind" title="Loại shell cho tab mới"></select>
      <button class="btn small ghost" id="term-new" title="Tab mới cùng thư mục"><svg class="ico"><use href="#i-plus"/></svg></button>
      <button class="btn small ghost" id="term-max" title="Phóng to / thu lại"><svg class="ico"><use href="#i-grid"/></svg></button>
      <button class="btn small ghost" id="term-min" title="Thu nhỏ (shell vẫn chạy)"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
    <div class="term-pop-body" id="term-pop-body"></div>
  </div>
  <button class="btn primary term-dock" id="term-dock" hidden><svg class="ico"><use href="#i-terminal"/></svg><span id="term-dock-label">Terminal</span></button>
  <div class="settings-backdrop" id="settings-backdrop" hidden></div>
  <aside class="settings" id="settings" hidden></aside>
  <style id="user-css"></style>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
